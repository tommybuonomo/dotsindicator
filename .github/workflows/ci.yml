name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build library
        run: ./gradlew :viewpagerdotsindicator:assembleRelease

      # Guard against shipping bytecode newer than Java 17 (class file major 61):
      # consumers building with JDK 17 cannot read Java 21 class files (issue #236)
      - name: Verify library bytecode targets Java 17
        run: |
          aar=$(ls viewpagerdotsindicator/build/outputs/aar/*-release.aar)
          workdir=$(mktemp -d)
          unzip -oq "$aar" classes.jar -d "$workdir"
          unzip -oq "$workdir/classes.jar" -d "$workdir/classes" '*.class'
          max=0
          while IFS= read -r class_file; do
            major=$(od -An -j6 -N2 -tu2 --endian=big "$class_file" | tr -d ' ')
            [ "$major" -gt "$max" ] && max=$major
          done < <(find "$workdir/classes" -name '*.class')
          echo "Highest class file major version in AAR: $max (Java $((max - 44)))"
          if [ "$max" -gt 61 ]; then
            echo "::error::AAR contains class files newer than Java 17 (major $max). Consumers on JDK 17 will fail to compile (see issue #236)."
            exit 1
          fi

      - name: Build sample
        run: ./gradlew :viewpagerdotsindicator-sample:assembleDebug

      - name: Run Android Lint
        run: ./gradlew :viewpagerdotsindicator:lint

      - name: Run unit tests + golden screenshot verification
        run: ./gradlew :viewpagerdotsindicator:testDebugUnitTest :viewpagerdotsindicator:verifyRoborazziDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: viewpagerdotsindicator/build/reports/lint-results*.html
          retention-days: 7

      - name: Upload test + screenshot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            viewpagerdotsindicator/build/reports/tests/**
            viewpagerdotsindicator/build/outputs/roborazzi/**
          retention-days: 7

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
